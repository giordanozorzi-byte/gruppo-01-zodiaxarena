<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Campagna social · Zodiax Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@700;800&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#10172B;color:#F3EBDD;font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:40px 16px calc(56px + env(safe-area-inset-bottom,0px))}
h1{margin:0 0 36px;text-align:center;font:900 clamp(28px,8vw,40px)/1.1 Cinzel,serif;letter-spacing:.04em;color:#FFF8EC}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:44px}
h2{margin:0 0 12px;display:flex;align-items:baseline;gap:10px;font:700 20px/1.2 Cinzel,serif;color:#FFF8EC}
h2 span{font:800 12px Nunito,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#E8B04B}
img{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
</style>
</head>
<body>
<main>
<h1>Campagna social</h1>
<ol>
<li>
<h2><span>Post 1</span>Il gatto</h2>
<img src="img/campagna/post-1.webp" alt="Post 1: Il gatto" width="1080" height="1350" loading="eager" decoding="async">
</li>
<li>
<h2><span>Post 2</span>Le fazioni</h2>

<li>

<li>
<h2><span>Post 4</span>La collezione</h2>

<li>
<h2><span>Post 5</span>L'arte della strategia</h2>

<img src="img/campagna/post-7.webp" alt="Post 7: Carte spiegate" width="1080" height="1350" loading="lazy" decoding="async">
